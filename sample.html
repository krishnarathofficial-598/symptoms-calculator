<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Animation & Auth | CodeByGaurav</title>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <div class="liquid-loader" id="loader">
        <div class="loading-text">
            Loading
            <span class="dot">.</span>
            <span class="dot">.</span>
            <span class="dot">.</span>
        </div>
        <div class="loader-track">
            <div class="liquid-fill"></div>
        </div>
    </div>

    <form class="login-form" id="login" style="display: none;">
        <h1 class="login-title">Login</h1>

        <div class="input-box">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="login-user" placeholder="Username" required>
        </div>
        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="login-pass" placeholder="Password" required>
        </div>

        <div class="remember-forgot-box">
            <label for="remember">
                <input type="checkbox" id="remember">
                Remember me
            </label>
            <a href="#">Forgot Password</a>
        </div>
        
        <button type="submit" class="login-btn">Login</button>
        <p class="register">
            Don't have an account?
            <a href="#" id="show-register">Register</a>
        </p>
    </form>

    <form class="login-form" id="register" style="display: none;">
        <h1 class="login-title">Register</h1>

        <div class="input-box">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="reg-user" placeholder="Choose Username" required>
        </div>
        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="reg-pass" placeholder="Choose Password" required>
        </div>
        
        <button type="submit" class="login-btn">Create Account</button>
        <p class="register">
            Already have an account?
            <a href="#" id="show-login">Login here</a>
        </p>
    </form>

    <script>
        const API_BASE_URL = 'https://symptoms-calculator.onrender.com';
        window.onload = function() {
            // --- Grab elements from the DOM ---
            const loader = document.getElementById("loader");
            const loginForm = document.getElementById("login");
            const registerForm = document.getElementById("register");
            
            // --- 1. Initial Loading Animation ---
            setTimeout(function() {
                if(loader) loader.style.display = "none";
                if(loginForm) loginForm.style.display = ""; 
            }, 2500); 

            // --- 2. Toggle between views ---
            document.getElementById("show-register").addEventListener("click", function(e) {
                e.preventDefault(); 
                loginForm.style.display = "none";
                registerForm.style.display = ""; 
            });

            document.getElementById("show-login").addEventListener("click", function(e) {
                e.preventDefault();
                registerForm.style.display = "none";
                loginForm.style.display = "";
            });

            // --- 3. Handle Registration ---
            registerForm.addEventListener("submit", async function(e) {
                e.preventDefault(); 
                
                const user = document.getElementById("reg-user").value;
                const pass = document.getElementById("reg-pass").value;

                try {
                    const response = await fetch(`${API_BASE_URL}/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: user, password: pass })
                    });

                    const data = await response.json();

                    if(response.ok) {
                        alert("Account successfully created! You can now log in.");
                        registerForm.reset();
                        registerForm.style.display = "none";
                        loginForm.style.display = "";
                    } else {
                        alert(data.message);
                    }
                } catch (error) {
                    console.error("Error connecting to server:", error);
                    alert("Could not connect. Is Node.js running?");
                }
            });

            // --- 4. Handle Login Authentication ---
            loginForm.addEventListener("submit", async function(e) {
                e.preventDefault();
                
                const user = document.getElementById("login-user").value;
                const pass = document.getElementById("login-pass").value;

                try {
                    const response = await fetch(`${API_BASE_URL}/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: user, password: pass })
                    });

                    const data = await response.json();

                    if(response.ok) {
                        // Success! Create session and redirect
                        sessionStorage.setItem("activeUser", user);
                        window.location.href = "dashboard.html";
                    } else {
                        alert(data.message); 
                    }
                } catch (error) {
                    console.error("Error connecting to server:", error);
                    alert("Could not connect. Is Node.js running?");
                }
            });
        };
    </script>
</body>
</html>
